# ============================================================================
# Logging Configuration File
# ============================================================================
# Function: Define log output format, level, and storage behavior.
# Author: jason
# Date: 2026-07-20
#
# Why need this file?
# ----------------------------------------------------------------------------
# 1. Control log output destination: console + file
# 2. Control log level: INFO by default, DEBUG for debugging
# 3. Control log format: timestamp + module name + level + message
# 4. Control log rotation: auto-rotate when file reaches 10MB, keep 5 backups
# 5. Separation of concerns: logging configuration is independent from code
#
# This is NOT mandatory. If you prefer, you can remove this file and configure
# logging directly in code using logging.basicConfig().
# ============================================================================

[loggers]
keys=root

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter,detailedFormatter


# ============================================================================
# Root Logger
# ============================================================================
# The root logger captures all log messages from all modules.
# level=INFO means only INFO, WARNING, ERROR, CRITICAL are logged.
# DEBUG messages are ignored (change to DEBUG for troubleshooting).
# ============================================================================

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler


# ============================================================================
# Console Handler
# ============================================================================
# Outputs logs to console (stdout) for real-time viewing.
# Useful for development and manual execution.
# ============================================================================

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)


# ============================================================================
# File Handler with Rotation
# ============================================================================
# Outputs logs to file for persistent storage and historical review.
# Rotation settings:
#   - maxBytes=10485760 (10MB): when file exceeds this, it rotates
#   - backupCount=5: keeps 5 old log files (sync.log.1 ... sync.log.5)
# This prevents the log file from growing indefinitely and filling up disk.
# ============================================================================

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=detailedFormatter
args=('logs/sync/sync.log', 'a', 10485760, 5)


# ============================================================================
# Formatters
# ============================================================================
# Define log message format.
#   simpleFormatter:   Used for console (shorter, cleaner)
#   detailedFormatter: Used for file (includes module name for debugging)
#
# Format fields:
#   %(asctime)s   - Timestamp
#   %(name)s      - Logger name (module name)
#   %(levelname)s - Log level (INFO, WARNING, ERROR, etc.)
#   %(message)s   - The actual log message
# ============================================================================

[formatter_simpleFormatter]
format=%(asctime)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S